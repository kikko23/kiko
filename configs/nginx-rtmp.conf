# Configuration Nginx RTMP pour streaming local
# À placer dans /etc/nginx/nginx.conf ou à inclure

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Application live standard
        application live {
            live on;
            record off;

            # Sécurité: seulement localhost peut publier
            allow publish 127.0.0.1;
            allow publish 192.168.0.0/16;  # Réseau local
            deny publish all;

            # Tout le monde peut voir
            allow play all;

            # Notification de connexion (optionnel)
            on_publish http://localhost:8080/on_publish;
            on_play http://localhost:8080/on_play;
        }

        # Application avec enregistrement
        application recorded {
            live on;
            record all;
            record_path /var/www/recordings;
            record_suffix -%Y-%m-%d-%H_%M_%S.flv;
            record_unique on;

            allow publish 127.0.0.1;
            allow publish 192.168.0.0/16;
            deny publish all;
        }

        # Application avec HLS
        application hls {
            live on;
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 6s;

            # Enregistrement HLS
            hls_continuous on;
        }

        # Application multibitrate
        application multi {
            live on;

            # Transcoding vers différentes qualités
            exec ffmpeg -i rtmp://localhost/multi/$name
                -c:v libx264 -b:v 3000k -s 1920x1080 -f flv rtmp://localhost/hls/$name_1080p
                -c:v libx264 -b:v 1500k -s 1280x720 -f flv rtmp://localhost/hls/$name_720p
                -c:v libx264 -b:v 800k -s 854x480 -f flv rtmp://localhost/hls/$name_480p;
        }
    }
}

# Configuration HTTP pour HLS et stats
http {
    server {
        listen 8080;

        # Stats RTMP
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # HLS stream
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Enregistrements
        location /recordings {
            alias /var/www/recordings;
            autoindex on;
            add_header Access-Control-Allow-Origin *;
        }

        # Page de lecture
        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
